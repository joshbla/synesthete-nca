[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synesthete-nca"
version = "0.1.0"
description = "Audio-conditioned neural cellular automata for organic visual synthesis."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2.2",
    "torch==2.11.0",
    "torchaudio==2.11.0",
]

[project.scripts]
synesthete-check = "synesthete.runtime:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/synesthete"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
